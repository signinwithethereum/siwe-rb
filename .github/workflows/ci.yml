name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec --tag ~live_rpc

  package:
    # Smoke-test the gem as it would land for end users: build, install, require,
    # exercise the public API in a fresh Ruby process with no Bundler context.
    # Catches packaging issues (missing files, bad require_paths, autoload typos)
    # that the in-repo specs miss.
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Build gem
        run: gem build siwe-rb.gemspec
      - name: Install gem
        run: gem install siwe-rb-*.gem
      - name: Smoke test
        run: ruby script/smoke_test.rb

  integration:
    runs-on: ubuntu-latest
    needs: spec
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - env:
          SIWE_RPC_URL: ${{ secrets.SIWE_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
        run: bundle exec rspec --tag live_rpc
