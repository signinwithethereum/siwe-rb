AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "spec/test-vectors/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 250

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/AccessorMethodName:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

# Our Siwe::Error takes a type symbol + kwargs (expected:, received:).
# Style/RaiseArgs autocorrect mangles `raise Error.new(type, expected: …)` into
# the unsupported `raise Error, type` form, so we disable it.
Style/RaiseArgs:
  Enabled: false
